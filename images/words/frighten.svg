  <title id="titulo">Un ruido sobresalta a un gato</title>
  <desc id="descripcion">Un gato da un pequeño sobresalto junto a una tapa metálica caída. Las líneas alrededor de la tapa representan ruido; el gato tiene los ojos abiertos y la cola levantada, sin peligro.</desc>
