  <title id="titulo">Contenta a causa del sol</title>
  <desc id="descripcion">A la izquierda brilla un sol grande. Una flecha va desde el sol hasta una niña sonriente con los brazos abiertos: la niña está contenta porque hace sol. El sol es la causa y la sonrisa, el resultado.</desc>
