      <path id="tallo" d="M159 88Q154 65 166 45" fill="none" stroke="#594235" stroke-width="7"/>
      <path id="hoja" d="M163 65Q182 36 210 48Q200 75 163 65Z" fill="#146B63"/>
      <path d="M168 63L199 51" fill="none" stroke="#7CAD96" stroke-width="1.8"/>
      <path d="M117 100Q106 113 109 131" fill="none" stroke="#FBF7EE" stroke-width="5"/>
      <path d="M145 88Q159 95 172 87" fill="none" stroke="#594235" stroke-width="1.8"/>
    </g>
  </g>
</svg>
