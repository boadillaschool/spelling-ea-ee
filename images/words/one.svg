<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Uno: una sola manzana</title>
  <desc id="descripcion">Uno: una sola manzana roja con su tallo y una hoja verde. La fruta está aislada para poder contarla; no hay otras frutas alrededor.</desc>
